<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="월별 메모 캘린더" />
  <!-- Cloudflare Worker(eoulrimstudio-upload): workers/eoulrimstudio-upload.worker.js 배포본 → 동일 호스트 /api/calendar-events -->
  <meta name="calendar-sync-url" content="https://eoulrimstudio-upload.eoulrimstudio.workers.dev/api/calendar-events" />
  <title>Eoulrim Calendar · 메모</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      
    </header>

    <main class="main">
      <section class="calendar-panel" aria-labelledby="calendar-heading">
        <h2 id="calendar-heading" class="visually-hidden">월간 달력</h2>

        <div class="compact-period">
          <p class="compact-period__display" id="viewPeriodHeading">년 월</p>
          <div class="compact-period__toolbar">
            <label class="compact-period__multi">
              <input type="checkbox" id="multiSelectToggle" />
              <span>다중 선택</span>
            </label>
            <button type="button" class="btn btn--ghost" id="btnToday">오늘</button>
            <div class="period-picker">
              <button
                type="button"
                class="btn btn--ghost"
                id="periodPickerTrigger"
                aria-expanded="false"
                aria-haspopup="dialog"
                aria-controls="periodPickerPopover"
              >
                날짜 설정
              </button>
              <div
                id="periodPickerPopover"
                class="period-picker__popover is-hidden"
                role="dialog"
                aria-label="년도와 월 선택"
                aria-hidden="true"
              >
                <div class="period-picker__row">
                  <label class="period-picker__field">
                    <span class="period-picker__mini-label">년</span>
                    <select id="periodYearSelect" class="period-picker__select" aria-label="년도"></select>
                  </label>
                  <label class="period-picker__field">
                    <span class="period-picker__mini-label">월</span>
                    <select id="periodMonthSelect" class="period-picker__select" aria-label="월"></select>
                  </label>
                </div>
              </div>
            </div>
            <div class="month-nav" role="group" aria-label="한 칸씩 이동">
              <button type="button" class="btn btn--icon" id="btnPrev" aria-label="이전 달"><span aria-hidden="true">‹</span></button>
              <button type="button" class="btn btn--icon" id="btnNext" aria-label="다음 달"><span aria-hidden="true">›</span></button>
            </div>
          </div>
        </div>

        <p id="syncStatus" class="sync-strip" aria-live="polite"></p>

        <div class="weekdays" role="row">
          <span class="weekdays__cell weekdays__cell--weekend">일</span>
          <span class="weekdays__cell">월</span>
          <span class="weekdays__cell">화</span>
          <span class="weekdays__cell">수</span>
          <span class="weekdays__cell">목</span>
          <span class="weekdays__cell">금</span>
          <span class="weekdays__cell weekdays__cell--weekend">토</span>
        </div>

        <div class="calendar-grid-shell" id="calendarGridShell" role="application" aria-label="달력"></div>
      </section>

      <aside class="detail-panel" aria-label="메모 작성 및 목록">
        <form class="memo-form" id="memoForm" autocomplete="off">
          <textarea
            name="memo"
            id="memoInput"
            class="memo-input"
            rows="5"
            maxlength="2000"
            placeholder="메모 입력"
          ></textarea>

          <input type="hidden" name="color" id="hiddenColor" value="#fde047" />

          <div class="color-picker-block">
            <div class="color-picker-block__chips">
              <div class="color-strip" role="group" aria-label="형광펜 색">
                <button type="button" class="color-chip color-chip--active" style="background-color:#fde047" data-color="#fde047" aria-pressed="true" title="노랑"></button>
                <button type="button" class="color-chip" style="background-color:#fda4af" data-color="#fda4af" aria-pressed="false" title="핑크"></button>
                <button type="button" class="color-chip" style="background-color:#86efac" data-color="#86efac" aria-pressed="false" title="민트"></button>
                <button type="button" class="color-chip" style="background-color:#7dd3fc" data-color="#7dd3fc" aria-pressed="false" title="하늘"></button>
                <button type="button" class="color-chip" style="background-color:#fdba74" data-color="#fdba74" aria-pressed="false" title="오렌지"></button>
                <button type="button" class="color-chip" style="background-color:#c4b5fd" data-color="#c4b5fd" aria-pressed="false" title="보라"></button>
              </div>
              <div class="color-legend-row" id="colorLegendRow" aria-hidden="true"></div>
            </div>
            <button type="button" class="btn-edit-legend" id="btnEditColorLegend" aria-label="형광펜 종류 이름 편집">
              <svg xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.121 2.121 0 0 1 3 3L7 19l-4 1 1-4Z"/></svg>
            </button>
          </div>

          <button type="submit" class="btn btn--primary">메모 추가</button>
        </form>

        <section class="day-memos" aria-label="선택 날짜별 메모">
          <div class="day-memos-toolbar" role="tablist" aria-label="메모 보기 모드">
            <button type="button" class="btn btn--ghost day-memos-toolbar__btn is-active" id="btnPanelViewDay" role="tab" aria-selected="true">선택 날짜</button>
            <button type="button" class="btn btn--ghost day-memos-toolbar__btn" id="btnPanelViewMonth" role="tab" aria-selected="false">전체 일정</button>
          </div>
          <div class="day-memo-stacks" id="dayMemoStacks"></div>
        </section>
      </aside>
    </main>
  </div>

  <div
    id="scopeConfirmModal"
    class="scope-modal is-hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="scopeModalTitle"
    aria-hidden="true"
  >
    <div class="scope-modal__backdrop" id="scopeModalBackdrop" tabindex="-1"></div>
    <div class="scope-modal__panel">
      <header class="scope-modal__head">
        <h2 id="scopeModalTitle" class="scope-modal__title"></h2>
        <button type="button" class="scope-modal__cancel" id="scopeModalCancel" aria-label="취소하고 닫기">
          취소
        </button>
      </header>
      <p id="scopeModalMessage" class="scope-modal__text"></p>
      <div class="scope-modal__actions">
        <button type="button" class="btn btn--ghost scope-modal__action-btn" id="scopeModalThisDay">이 날짜만</button>
        <button type="button" class="btn btn--primary scope-modal__action-btn" id="scopeModalAllDays">모든 날짜</button>
      </div>
    </div>
  </div>

  <div
    id="colorLabelsModal"
    class="scope-modal is-hidden"
    role="dialog"
    aria-modal="true"
    aria-labelledby="colorLabelsModalTitle"
    aria-hidden="true"
  >
    <div class="scope-modal__backdrop" id="colorLabelsModalBackdrop" tabindex="-1"></div>
    <div class="scope-modal__panel scope-modal__panel--labels">
      <header class="scope-modal__head">
        <h2 id="colorLabelsModalTitle" class="scope-modal__title">형광펜 종류 이름</h2>
        <button type="button" class="scope-modal__cancel" id="colorLabelsModalCancel" aria-label="닫기">닫기</button>
      </header>
      <p class="scope-modal__text">각 색에 붙일 짧은 이름을 적어 두면 목록 아래에 함께 표시됩니다.</p>
      <div class="color-labels-edit" id="colorLabelsEditFields"></div>
      <div class="scope-modal__actions scope-modal__actions--stack">
        <button type="button" class="btn btn--primary scope-modal__action-btn" id="colorLabelsModalSave">저장</button>
      </div>
    </div>
  </div>

  <script src="js/calendar.js"></script>
</body>
</html>
