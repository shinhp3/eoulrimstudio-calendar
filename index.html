<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="description" content="월별 메모 캘린더" />
  <meta name="calendar-sync-url" content="https://eoulrimstudio-upload.eoulrimstudio.workers.dev/api/calendar-events" />
  <title>Eoulrim Calendar · 메모</title>
  <link rel="stylesheet" href="css/styles.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+KR:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>
  <div class="app">
    <header class="header">
      <div class="header__brand">
        <span class="header__logo" aria-hidden="true"></span>
        <div>
          <h1 class="header__title">메모 캘린더</h1>
          <p class="header__subtitle">날짜를 여러 개 고르고 한 번에 메모를 붙일 수 있어요</p>
        </div>
      </div>
    </header>

    <main class="main">
      <section class="calendar-panel" aria-labelledby="calendar-heading">
        <h2 id="calendar-heading" class="visually-hidden">월간 달력</h2>

        <div class="compact-period">
          <span id="viewPeriodLabel" class="compact-period__label"></span>
          <div class="compact-period__tools">
            <button type="button" class="btn btn--ghost" id="btnToday">오늘</button>
            <div class="month-nav" role="group" aria-label="월 이동">
              <button type="button" class="btn btn--icon" id="btnPrev" aria-label="이전 달"><span aria-hidden="true">‹</span></button>
              <button type="button" class="btn btn--icon" id="btnNext" aria-label="다음 달"><span aria-hidden="true">›</span></button>
            </div>
          </div>
        </div>

        <div class="masthead-board" aria-live="polite">
          <div class="masthead-board__inner" id="mastheadBoard"></div>
          <p class="masthead-board__sync" id="syncStatus"></p>
        </div>

        <div class="weekdays" role="row">
          <span class="weekdays__cell weekdays__cell--weekend">일</span>
          <span class="weekdays__cell">월</span>
          <span class="weekdays__cell">화</span>
          <span class="weekdays__cell">수</span>
          <span class="weekdays__cell">목</span>
          <span class="weekdays__cell">금</span>
          <span class="weekdays__cell weekdays__cell--weekend">토</span>
        </div>

        <div class="calendar-grid-shell" id="calendarGridShell" role="application" aria-label="달력"></div>
      </section>

      <aside class="detail-panel" aria-label="메모 입력">
        <p class="selection-summary" id="selectionSummary"></p>

        <form class="memo-form" id="memoForm" autocomplete="off">
          <textarea
            name="memo"
            id="memoInput"
            class="memo-input"
            rows="5"
            maxlength="2000"
            placeholder="메모를 적고 색을 고른 뒤 추가하세요."
          ></textarea>

          <input type="hidden" name="color" id="hiddenColor" value="#fde047" />

          <div class="color-strip" role="group" aria-label="형광펜 색">
            <button type="button" class="color-chip color-chip--active" style="background-color:#fde047" data-color="#fde047" aria-pressed="true" title="노랑"></button>
            <button type="button" class="color-chip" style="background-color:#fda4af" data-color="#fda4af" aria-pressed="false" title="핑크"></button>
            <button type="button" class="color-chip" style="background-color:#86efac" data-color="#86efac" aria-pressed="false" title="민트"></button>
            <button type="button" class="color-chip" style="background-color:#7dd3fc" data-color="#7dd3fc" aria-pressed="false" title="하늘"></button>
            <button type="button" class="color-chip" style="background-color:#fdba74" data-color="#fdba74" aria-pressed="false" title="오렌지"></button>
            <button type="button" class="color-chip" style="background-color:#c4b5fd" data-color="#c4b5fd" aria-pressed="false" title="보라"></button>
          </div>

          <button type="submit" class="btn btn--primary">선택한 날짜에 적용</button>
        </form>
      </aside>
    </main>

    <footer class="footer">
      <p>동기화 주소가 있으면 변경 사항이 자동으로 서버에 반영됩니다.</p>
    </footer>
  </div>

  <script src="js/calendar.js"></script>
</body>
</html>
